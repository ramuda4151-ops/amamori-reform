name: daily-gsc-export
on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 06:00 JST（朝8時の改善routineが参照）
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Export GSC data
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
        run: python tools/export_gsc.py
      - name: Commit report
        run: |
          git config user.name "gsc-bot"
          git config user.email "actions@github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: GSCレポート更新"
          git push
