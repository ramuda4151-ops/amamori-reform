<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | 雨漏りリフォームナビ</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#33302b;--ink-light:#7c766c;--ground:#fbfaf7;--paper:#ffffff;--line:#e7e2d8;--primary:#17756d}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--ground);line-height:1.9;font-size:16px;display:flex;flex-direction:column;min-height:100vh}
    .site-header{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 16px}
    .site-name{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:20px;color:var(--primary);text-decoration:none}
    .site-name span{color:var(--ink)}
    main{flex:1;max-width:740px;margin:0 auto;padding:60px 16px;text-align:center}
    h1{font-family:'Zen Maru Gothic',sans-serif;font-size:24px;margin-bottom:16px}
    p{margin-bottom:24px;color:var(--ink-light)}
    .btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;padding:12px 28px;border-radius:24px;font-weight:700}
  </style>
</head>
<body>
<header class="site-header">
  <a class="site-name" href="/">雨漏りリフォーム<span>ナビ</span></a>
</header>
<main>
  <h1>お探しのページが見つかりません</h1>
  <p>ページが移動または削除された可能性があります。<br>トップページから地域別の記事・コラムをお探しください。</p>
  <a class="btn" href="/">トップページへ戻る</a>
</main>
</body>
</html>
